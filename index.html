<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Firebase Chat Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #6c757d;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e5e7eb;
            --sidebar-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #374151;
            --sidebar-bg: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .auth-container {
            padding: 30px;
        }

        /* Tabs Header */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 6px;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Forms */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        /* Dashboard Layout */
        #dashboard-view {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--bg-color);
            flex-direction: row;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .sidebar small {
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .nav-links {
            list-style: none;
            flex: 1;
        }

        .nav-links li {
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .nav-links li.active, .nav-links li:hover {
            background: var(--bg-color);
            color: var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .content-panel {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .content-panel.active {
            display: flex;
        }

        /* Chat Dashboard Controls */
        .chat-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .room-list {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: var(--card-bg);
            overflow-y: auto;
        }

        .room-item {
            padding: 12px;
            background: var(--bg-color);
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Active Room Chat Box */
        .chat-box {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--bg-color);
            max-width: 70%;
            word-break: break-word;
        }

        .chat-msg .sender-label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
        }

        /* Settings Panel Layout */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
        }

        .settings-item {
            margin-bottom: 20px;
        }

        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #4b5563; }

        /* Popups / Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CONTAINER (Defaults directly to Login Page view) -->
    <div class="container" id="auth-container" style="display: block;">
        <div class="auth-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="login-panel" class="form-panel active">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="Enter password">
                </div>
                <button class="btn" onclick="handleLogin()">Login</button>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-panel" class="form-panel">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label>Choose Password</label>
                    <input type="password" id="signup-pass" placeholder="Create password">
                </div>
                <button class="btn" onclick="handleSignUp()">Create Account</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" style="display: none;">
        <div class="sidebar">
            <h2>Messenger</h2>
            <small id="logged-in-user-label">Logged in as: </small>
            <ul class="nav-links">
                <li id="nav-chat-tab" class="active" onclick="switchDashboardTab('chat', event)">Chat Rooms</li>
                <li id="nav-settings-tab" onclick="switchDashboardTab('settings', event)">Settings</li>
            </ul>
        </div>

        <div class="main-content">
            <!-- Chat Tab Panel (Room List) -->
            <div id="chat-panel" class="content-panel active">
                <div class="chat-actions">
                    <button class="btn" style="width: auto;" onclick="openCreateModal()">Create Room</button>
                    <button class="btn btn-secondary" style="width: auto;" onclick="openJoinModal()">Join Room</button>
                </div>
                <h3>Your Rooms</h3><br>
                <div class="room-list" id="room-list-container">
                    <!-- Rooms dynamically injected here -->
                </div>
            </div>

            <!-- Active Room Chat Panel -->
            <div id="room-chat-panel" class="content-panel">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                    <h3 id="active-room-title">Room Name</h3>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; margin: 0;" onclick="backToRoomList()">Back to Rooms</button>
                </div>
                <div class="chat-box" id="active-chat-box">
                    <div class="chat-msg"><i>Welcome to the room! Messages sync in real-time via Firebase.</i></div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="room-message-input" placeholder="Type a message..." onkeypress="handleChatKeyPress(event)">
                    <button class="btn" style="width: auto; margin:0;" onclick="sendRoomMessage()">Send</button>
                </div>
            </div>

            <!-- Settings Tab Panel -->
            <div id="settings-panel" class="content-panel">
                <h3>Preferences & Controls</h3><br>
                <div class="settings-card">
                    <div class="settings-item">
                        <label>Background Theme</label>
                        <select id="theme-selector" onchange="changeTheme(this.value)">
                            <option value="light">White (Light)</option>
                            <option value="dark">Black (Dark)</option>
                        </select>
                    </div>
                    <div class="settings-item">
                        <button class="btn btn-secondary" onclick="resetPassword()">Reset Password</button>
                    </div>
                    <div class="settings-item">
                        <button class="btn btn-danger" onclick="deleteAccount()">Delete Account</button>
                    </div>
                    <div class="settings-item" style="margin-bottom: 0;">
                        <button class="btn" onclick="signOut()">Sign Out</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CREATE ROOM MODAL -->
    <div class="modal" id="create-room-modal">
        <div class="modal-content">
            <h3>Create Chat Room</h3>
            <div class="input-group" style="margin-top: 15px;">
                <label>Room Name</label>
                <input type="text" id="new-room-name" placeholder="e.g. Study Group">
            </div>
            <div class="input-group">
                <label>4-Digit Join Code</label>
                <input type="text" id="new-room-code" maxlength="4" placeholder="e.g. 1234">
            </div>
            <button class="btn" onclick="confirmCreateRoom()">Create</button>
            <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- JOIN ROOM MODAL -->
    <div class="modal" id="join-room-modal">
        <div class="modal-content">
            <h3>Join Chat Room</h3>
            <div class="input-group" style="margin-top: 15px;">
                <label>Enter 4-Digit Code</label>
                <input type="text" id="join-room-code" maxlength="4" placeholder="e.g. 1234">
            </div>
            <button class="btn" onclick="confirmJoinRoom()">Join</button>
            <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- FIREBASE SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut as fbSignOut, 
            sendPasswordResetEmail, 
            deleteUser, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDoc, 
            arrayUnion, 
            query, 
            addDoc, 
            onSnapshot, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAotwXoPkHGxselCOWH2mw51x4VuhDJUzY",
            authDomain: "chatbase-634c8.firebaseapp.com",
            projectId: "chatbase-634c8",
            storageBucket: "chatbase-634c8.firebasestorage.app",
            messagingSenderId: "798124008105",
            appId: "1:798124008105:web:ec5d06d89f4008c4fa7fb8",
            measurementId: "G-RMM389DKK2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentOpenRoom = null;
        let unsubscribeMessages = null;

        window.switchAuthTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('login-panel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('signup-panel').classList.add('active');
            }
        };

        window.handleSignUp = async function() {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-pass').value.trim();

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    email: user.email,
                    rooms: ["0000"]
                });

                const lobbyRef = doc(db, "rooms", "0000");
                const lobbySnap = await getDoc(lobbyRef);
                if (!lobbySnap.exists()) {
                    await setDoc(lobbyRef, { name: "General Lobby", code: "0000", owner: "System" });
                }

                alert('Account created successfully!');
            } catch (error) {
                console.error("Sign up full error:", error);
                alert('Sign up error: ' + error.message);
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Login full error:", error);
                alert('Login failed: ' + error.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('logged-in-user-label').innerText = `Logged in as: ${user.email}`;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'flex';
                loadUserRooms();
            } else {
                currentUser = null;
                if (unsubscribeMessages) unsubscribeMessages();
                document.getElementById('dashboard-view').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
                window.switchAuthTab('login');
            }
        });

        async function loadUserRooms() {
            if (!currentUser) return;
            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userDocRef);
                
                let roomCodes = ["0000"];
                if (userSnap.exists()) {
                    roomCodes = userSnap.data().rooms || ["0000"];
                } else {
                    // Automatically provision missing profile document if logging into an older account
                    await setDoc(userDocRef, { email: currentUser.email, rooms: ["0000"] }, { merge: true });
                }

                const container = document.getElementById('room-list-container');
                container.innerHTML = '';

                for (let code of roomCodes) {
                    const roomDocRef = doc(db, "rooms", code);
                    const roomSnap = await getDoc(roomDocRef);
                    if (roomSnap.exists()) {
                        const roomData = roomSnap.data();
                        const isOwner = roomData.owner === currentUser.email;
                        container.innerHTML += `
                            <div class="room-item">
                                <div>
                                    <strong>${roomData.name}</strong> 
                                    <small style="color:var(--text-muted); display:block;">Code: ${roomData.code} ${isOwner ? '(Owner)' : ''}</small>
                                </div>
                                <button class="btn" style="width: auto; padding: 6px 12px; margin: 0;" onclick="openRoomByCode('${roomData.code}', '${roomData.name}')">Open</button>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error("Error loading rooms:", error);
            }
        }

        window.openRoomByCode = function(code, name) {
            currentOpenRoom = { code, name };
            document.getElementById('active-room-title').innerText = `${name} (Code: ${code})`;
            
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('room-chat-panel').classList.add('active');

            if (unsubscribeMessages) unsubscribeMessages();
            
            const msgQuery = query(collection(db, "rooms", code, "messages"), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(msgQuery, (snapshot) => {
                const chatBox = document.getElementById('active-chat-box');
                let html = '<div class="chat-msg"><i>Welcome to the room! Messages sync in real-time.</i></div>';
                
                snapshot.forEach((docSnap) => {
                    const m = docSnap.data();
                    const isSelf = m.sender === currentUser.email;
                    const alignStyle = isSelf ? 'margin-left: auto; background: var(--primary); color: white;' : 'margin-right: auto;';
                    html += `
                        <div class="chat-msg" style="${alignStyle}">
                            <span class="sender-label" style="${isSelf ? 'color: #e0e7ff;' : ''}">${m.sender}</span>
                            ${m.text}
                        </div>
                    `;
                });
                chatBox.innerHTML = html;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, (error) => {
                console.error("Firestore snapshot error:", error);
            });
        };

        window.backToRoomList = function() {
            if (unsubscribeMessages) unsubscribeMessages();
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('chat-panel').classList.add('active');
            loadUserRooms();
        };

        window.sendRoomMessage = async function() {
            const input = document.getElementById('room-message-input');
            const msgText = input.value.trim();
            if (!msgText || !currentOpenRoom) return;

            try {
                await addDoc(collection(db, "rooms", currentOpenRoom.code, "messages"), {
                    sender: currentUser.email,
                    text: msgText,
                    timestamp: Date.now()
                });
                input.value = '';
            } catch (error) {
                console.error("Error sending message:", error);
            }
        };

        window.handleChatKeyPress = function(event) {
            if(event.key === 'Enter') {
                window.sendRoomMessage();
            }
        };

        window.switchDashboardTab = function(tab, event) {
            if (unsubscribeMessages) unsubscribeMessages();
            document.querySelectorAll('.nav-links li').forEach(l => l.classList.remove('active'));
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));

            if(event) event.target.classList.add('active');
            
            if(tab === 'chat') {
                document.getElementById('chat-panel').classList.add('active');
                loadUserRooms();
            } else if(tab === 'settings') {
                document.getElementById('settings-panel').classList.add('active');
            }
        };

        window.changeTheme = function(theme) {
            if(theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        };

        window.openCreateModal = function() { document.getElementById('create-room-modal').style.display = 'flex'; };
        window.openJoinModal = function() { document.getElementById('join-room-modal').style.display = 'flex'; };
        window.closeModals = function() {
            document.getElementById('create-room-modal').style.display = 'none';
            document.getElementById('join-room-modal').style.display = 'none';
        };

        window.confirmCreateRoom = async function() {
            const name = document.getElementById('new-room-name').value.trim();
            const code = document.getElementById('new-room-code').value.trim();
            
            if(!name || code.length !== 4) {
                alert('Please enter a valid room name and a 4-digit code.');
                return;
            }

            try {
                const roomRef = doc(db, "rooms", code);
                const roomSnap = await getDoc(roomRef);

                if (roomSnap.exists()) {
                    alert('A room with this 4-digit code already exists!');
                    return;
                }

                await setDoc(roomRef, { name, code, owner: currentUser.email });

                const userDocRef = doc(db, "users", currentUser.uid);
                await setDoc(userDocRef, {
                    email: currentUser.email,
                    rooms: arrayUnion(code)
                }, { merge: true });

                loadUserRooms();
                window.closeModals();
                document.getElementById('new-room-name').value = '';
                document.getElementById('new-room-code').value = '';
            } catch (error) {
                console.error("Create room full error:", error);
                alert('Error creating room: ' + error.message);
            }
        };

        window.confirmJoinRoom = async function() {
            const code = document.getElementById('join-room-code').value.trim();
            if(code.length !== 4) {
                alert('Please enter a valid 4-digit code.');
                return;
            }

            try {
                const roomRef = doc(db, "rooms", code);
                const roomSnap = await getDoc(roomRef);

                if(!roomSnap.exists()) {
                    alert('Error: No room exists with this 4-digit code!');
                    return;
                }

                const userDocRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userDocRef);
                const joinedRooms = userSnap.exists() ? (userSnap.data().rooms || []) : [];

                if (joinedRooms.includes(code)) {
                    alert('You have already joined this room.');
                    window.closeModals();
                    return;
                }

                await setDoc(userDocRef, {
                    email: currentUser.email,
                    rooms: arrayUnion(code)
                }, { merge: true });

                loadUserRooms();
                window.closeModals();
                document.getElementById('join-room-code').value = '';
                alert(`Successfully joined room: "${roomSnap.data().name}"!`);
            } catch (error) {
                console.error("Join room full error:", error);
                alert('Error joining room: ' + error.message);
            }
        };

        window.resetPassword = async function() {
            if (!currentUser || !currentUser.email) return;
            try {
                await sendPasswordResetEmail(auth, currentUser.email);
                alert("Password reset email sent to " + currentUser.email);
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        window.deleteAccount = async function() {
            if(confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                try {
                    await deleteUser(auth.currentUser);
                    alert("Account deleted.");
                } catch (error) {
                    alert("Error deleting account: " + error.message + "\n(Note: Firebase requires recent sign-in to delete accounts).");
                }
            }
        };

        window.signOut = async function() {
            try {
                await fbSignOut(auth);
            } catch (error) {
                console.error("Sign out error:", error);
            }
        };
    </script>
</body>
</html>
